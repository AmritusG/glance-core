[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.7.1"
edition = "2024"
# Same floor as DXVKit Plus (let-chains, edition 2024).
rust-version = "1.95"
license = "MIT"
authors = ["Amrit Rosell"]
repository = "https://github.com/AmritusG/glance-core"
publish = false

[workspace.dependencies]
glance-media = { path = "crates/glance-media" }
glance-gpu = { path = "crates/glance-gpu" }
glance-playback = { path = "crates/glance-playback" }
glance-ui = { path = "crates/glance-ui" }
glance-audio = { path = "crates/glance-audio" }
glance-platform = { path = "crates/glance-platform" }
glance-settings = { path = "crates/glance-settings" }
glance-encode = { path = "crates/glance-encode" }
glance-library = { path = "crates/glance-library" }
glance-arena = { path = "crates/glance-arena" }
# Decoders, demux, transport and BC upload are DXVKit Plus's (MIT, Amrit's own): the core never
# carries a second copy of a decoder. Pinned by tag; bumped deliberately (docs/00-ROADMAP.md §4).
dxvkit-plus-core = { git = "https://github.com/AmritusG/DXVKit-Plus", tag = "v0.14.0" }
dxvkit-plus-wgpu = { git = "https://github.com/AmritusG/DXVKit-Plus", tag = "v0.14.0" }
dxvkit-plus-apple = { git = "https://github.com/AmritusG/DXVKit-Plus", tag = "v0.14.0" }
dxvkit-plus-enc = { git = "https://github.com/AmritusG/DXVKit-Plus", tag = "v0.14.0" }
# Windows: the Media Foundation reader (0.14.0; it ran on Windows: DXVKit Plus run 44171687138).
dxvkit-plus-windows = { git = "https://github.com/AmritusG/DXVKit-Plus", tag = "v0.14.0" }
# One wgpu major across DXVKit Plus, loombda-rs and egui 0.36 (which requires wgpu ^30).
wgpu = "30.0.1"
egui = { version = "0.36.2", default-features = false }
# Menus and dialogs (Tauri's muda, MIT OR Apache-2.0; rfd, MIT). No default features: the defaults
# are the Linux GTK / portal backends, not built for.
muda = { version = "0.21.2", default-features = false }
rfd = { version = "0.18.0", default-features = false }
# The window handle type winit 0.30 hands out (its `rwh_06`).
raw-window-handle = "0.6.2"
egui-wgpu = { version = "0.36.2", default-features = false }
egui-winit = { version = "0.36.2", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
pollster = "1.0.1"
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Audio output: CoreAudio on macOS / iOS, WASAPI on Windows (Apache-2.0). No default features.
cpal = "0.18.2"
# Offline sample-rate conversion, the FFT resampler (MIT OR Apache-2.0).
rubato = "5.1.0"
# SHA-256 for the clip key (RustCrypto, MIT OR Apache-2.0).
sha2 = "0.11"
# SQLite (MaCrate's library): rusqlite, MIT. macOS links the system SQLite; other targets add "bundled".
rusqlite = "0.41"
uuid = { version = "1", features = ["v4"] }
# Unicode NFC / NFD / NFKD for MaCrate's path and name rules. Pinned: 0.1.25 is MIT OR Apache-2.0; 0.1.26
# adds Unicode-3.0, which deny.toml does not allow.
unicode-normalization = "=0.1.25"
# MaCrate's thumbnail cache: JPEG encode (quality 0.85) and decode (zune-jpeg), Lanczos downscale. MIT OR Apache-2.0;
# only the JPEG codec, no other formats, no threads.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

# Never-crash rules, the same set DXVKit Plus and loombda-rs build under.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "warn"

[profile.release]
debug = 1
