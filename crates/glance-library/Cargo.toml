[package]
name = "glance-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "MaCrate's library: the SQLite twin of Swift MaCrate's database, sidecars, stash files, clip_id, header reader and folder rules"

[lints]
workspace = true

[dependencies]
glance-media = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
unicode-normalization = { workspace = true }

# The system SQLite on macOS (what Swift MaCrate's GRDB links; FTS5 is compiled in), SQLite's own amalgamation
# elsewhere (FTS5 enabled by rusqlite's bundled build).
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { workspace = true }
[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[dev-dependencies]
