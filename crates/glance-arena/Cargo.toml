[package]
name = "glance-arena"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Resolume Arena client for the Glance family (Send to Arena): REST, websocket, composition snapshot, load planner, menu model. Ported from SendEhrKit, relicensed MIT by its author."

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# NFC for the file URL Arena opens.
unicode-normalization = { workspace = true }
# Local wall-clock time for the event log's "HH:mm:ss.SSS" (Unlicense OR MIT): the system time
# zone, read from the OS's zoneinfo (a bundled copy on Windows).
jiff = { version = "1.0.0", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
